<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0C1A41',
            brandGold: '#F8B813',
            bgDark: '#0E1726',
            cardBg: '#1B2E4B',

          fontFamily: {

  <style>
    body {
      background-color: #0E1726;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Radial gradient background background */
    .bg-gradient-portal {
      background: radial-gradient(circle at top center, #1b2e4b 0%, #0e1726 80%);
    }

    /* Card styling */
    .glass-card {
      background: rgba(27, 46, 75, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(248, 184, 19, 0.25);
    }

    .glass-card:hover {
      border-color: rgba(248, 184, 19, 0.7);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4), 0 0 12px rgba(248, 184, 19, 0.2);
    }

    .app-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-gradient-portal text-white min-h-screen flex flex-col justify-between p-4 sm:p-6">

      <!-- Title & Subtitle -->

        CloudZii <span class="text-brandGold">Dine</span>

      <p class="text-xs sm:text-sm text-gray-300 mt-1 font-medium">
        Restaurant Management System

    </header>

    <!-- Strictly Requested 6 Links Grid -->
    <main class="flex flex-col gap-3 my-2">

      <!-- 1. WhatsApp Direct -->

        <div class="flex items-center space-x-3.5">

            <i class="fa-brands fa-whatsapp"></i>
          </div>
          <div>
            <h2 class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">WhatsApp</h2>
            <p class="text-xs text-gray-300 mt-0.5">+252 61 029 6625</p>
          </div>

      <!-- 2. Official Website -->
      <a

        class="glass-card rounded-xl p-3.5 sm:p-4 flex items-center justify-between app-transition group"
      >
        <div class="flex items-center space-x-3.5">
          <div class="w-11 h-11 rounded-xl bg-brandDark text-brandGold border border-brandGold/40 flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition-transform flex-shrink-0">
            <i class="fa-solid fa-globe"></i>
          </div>
          <div>

      <!-- 3. Facebook Page -->

      >
        <div class="flex items-center space-x-3.5">

    <!-- Save Contact Button -->
    <div class="mt-5 mb-2">
      <button 
        id="saveContactBtn"
        class="w-full bg-brandGold hover:bg-yellow-400 text-brandDark font-extrabold py-3.5 px-6 rounded-xl text-sm tracking-wide shadow-xl flex items-center justify-center gap-2.5 transition-all transform active:scale-95 cursor-pointer"

    </div>

    <!-- Footer -->
    <footer class="text-center py-2">
      <p class="text-[11px] text-gray-400 font-medium">
        © 2026 CloudZii Dine. All rights reserved.
      </p>
    </footer>

  </div>

  <!-- Toast Notification -->
  <div 
    id="toast" 
    class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-brandGold text-brandDark font-bold px-5 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4 flex items-center gap-2 z-50 text-xs border border-yellow-300"
  >
    <i class="fa-solid fa-circle-check text-sm"></i>
    <span id="toastMsg">Xogta waa la kaydiyay!</span>
  </div>

  <script>
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 3000);
    }

    document.getElementById('saveContactBtn').addEventListener('click', () => {
      const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:CloudZii Dine
ORG:CloudZii Dine - Restaurant Management System
TITLE:Restaurant Management System
TEL;TYPE=CELL,VOICE:+252610296625
URL:https://cloudiizii.com
X-SOCIALPROFILE;type=facebook:https://www.facebook.com/share/14sne3X8Jic/?mibextid=wwXIfr
X-SOCIALPROFILE;type=tiktok:https://www.tiktok.com/@cloudziiofficial0
X-SOCIALPROFILE;type=instagram:https://www.instagram.com/cloudzii
NOTE:CloudZii Dine Official Contact
END:VCARD`;

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'CloudZii_Dine.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('CloudZii Dine contact saved!');
    });
  </script>
